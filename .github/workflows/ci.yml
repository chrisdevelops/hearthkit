name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hearthkit
          POSTGRES_PASSWORD: hearthkit
          POSTGRES_DB: hearthkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hearthkit"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The db package shells out to pg_dump/pg_restore and needs the v17 client
      # (the runner image ships v16, which refuses a v17 server).
      - name: Install Postgres 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # The image's v16 client shadows v17 through the pg_wrapper symlinks;
          # putting the versioned bin dir first makes pg_dump/pg_restore resolve to 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # MinIO cannot be a service container like postgres above: the image needs
      # `server /data` arguments to start, and a service container has no way to set a
      # command. Starting it from the repo's own compose file is better than a bespoke
      # `docker run` anyway, because the image tag, credentials, ports and healthcheck
      # then have exactly one definition shared by CI and local gates. `--wait` blocks
      # until the compose healthcheck reports healthy, so the storage gates never race it.
      #
      # Mailpit joins it here for the email gates. Unlike MinIO it could have been a service
      # container, but it needs MP_ENABLE_CHAOS and a tightened healthcheck, and compose is
      # already the one place both are written down. Cold start for both: about 6 seconds.
      - name: Start MinIO and Mailpit for the storage and email gates
        run: docker compose up -d --wait minio mailpit
      - run: pnpm --recursive --if-present run test
      - name: Stop compose services
        if: always()
        run: docker compose down -v
